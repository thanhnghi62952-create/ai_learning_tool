<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực - AI Learning Tool</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-center items-center px-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200 p-8 transition-all">
        <div class="text-center mb-8">
            <span class="text-4xl">🚀</span>
            <h2 id="authTitle" class="text-2xl font-bold text-slate-900 mt-3">Đăng nhập tài khoản</h2>
            <p id="authSubtitle" class="text-slate-500 text-sm mt-1">Đăng nhập để tiếp tục lộ trình học tập của bạn</p>
        </div>

        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-600 text-sm px-4 py-3 rounded-xl mb-6 flex items-center gap-2">
            <span>⚠️</span> <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" id="authForm" action="/login">
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Địa chỉ Email</label>
                    <input type="email" name="email" required placeholder="name@company.com" 
                        class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-hidden focus:ring-2 focus:ring-indigo-500 text-sm shadow-inner">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Mật khẩu</label>
                    <input type="password" name="password" required placeholder="••••••••" 
                        class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-hidden focus:ring-2 focus:ring-indigo-500 text-sm shadow-inner">
                </div>
                
                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition-colors text-sm shadow-lg shadow-indigo-100 cursor-pointer mt-2">
                    Đăng nhập
                </button>
            </div>
        </form>

        <div class="text-center mt-6 pt-6 border-t border-slate-100 text-sm">
            <p id="toggleText" class="text-slate-500">
                Chưa có tài khoản?<button onclick="switchToSignUp()" class="text-indigo-600 font-semibold hover:underline bg-transparent border-none cursor-pointer">Đăng ký ngay</button>
            </p>
        </div>
    </div>

    <script>
        const authTitle = document.getElementById('authTitle');
        const authSubtitle = document.getElementById('authSubtitle');
        const authForm = document.getElementById('authForm');
        const submitBtn = document.getElementById('submitBtn');
        const toggleText = document.getElementById('toggleText');

        function switchToSignUp() {
            authTitle.textContent = "Tạo tài khoản mới";
            authSubtitle.textContent = "Bắt đầu trải nghiệm học tập đỉnh cao cùng AI";
            authForm.action = "/register";
            submitBtn.textContent = "Đăng ký tài khoản";
            toggleText.innerHTML = `Đã có tài khoản? <button onclick="switchToLogin()" class="text-indigo-600 font-semibold hover:underline bg-transparent border-none cursor-pointer">Đăng nhập</button>`;
        }

        function switchToLogin() {
            authTitle.textContent = "Đăng nhập tài khoản";
            authSubtitle.textContent = "Đăng nhập để tiếp tục lộ trình học tập của bạn";
            authForm.action = "/login";
            submitBtn.textContent = "Đăng nhập";
            toggleText.innerHTML = `Chưa có tài khoản? <button onclick="switchToSignUp()" class="text-indigo-600 font-semibold hover:underline bg-transparent border-none cursor-pointer">Đăng ký ngay</button>`;
        }
    </script>
</body>
</html>
