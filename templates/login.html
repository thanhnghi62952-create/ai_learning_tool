<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - AI Learning Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
        .btn-primary { background-color: #2b5a8f; border: none; }
        .btn-primary:hover { background-color: #1e3f66; }
    </style>
</head>
<body>

<div class="card p-4">
    <h3 class="text-center mb-4" style="color: #2b5a8f; font-weight: 600;">Học Liệu AI</h3>
    
    {% if error %}
        <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}">
        <div class="mb-3">
            <label for="email" class="form-label">Email tài khoản</label>
            <input type="email" class="form-control" id="email" name="email" required placeholder="name@example.com">
        </div>
        <div class="mb-4">
            <label for="password" class="form-label">Mật khẩu</label>
            <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">Đăng Nhập</button>
    </form>
</div>

</body>
</html>
